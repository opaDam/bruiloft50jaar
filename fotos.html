<style>
  :root {
    --bg-color: #111;
    --text-color: #fff;
    --tab-bg: #222;
    --tab-hover: #333;
    --accent: #0078ff;
    --overlay-bg: rgba(0, 0, 0, 0.9);
  }

  body.light {
    --bg-color: #f5f5f5;
    --text-color: #111;
    --tab-bg: #ddd;
    --tab-hover: #ccc;
    --accent: #0078ff;
    --overlay-bg: rgba(255, 255, 255, 0.9);
  }

  body {
    font-family: Arial, sans-serif;
    background-color: var(--bg-color);
    color: var(--text-color);
    margin: 0;
    padding: 0;
    transition: background 0.4s, color 0.4s;
  }

  h1 {
    text-align: center;
    margin-top: 20px;
  }

  .controls {
    text-align: center;
    margin: 10px 0;
  }

  .toggle-btn, .slideshow-btn {
    background-color: var(--tab-bg);
    color: var(--text-color);
    border: none;
    padding: 10px 16px;
    border-radius: 6px;
    margin: 0 6px;
    cursor: pointer;
    font-size: 14px;
    transition: 0.3s;
  }

  .toggle-btn:hover, .slideshow-btn:hover {
    background-color: var(--tab-hover);
  }

  .tab-container {
    display: flex;
    justify-content: center;
    background-color: var(--tab-bg);
    flex-wrap: wrap;
  }

  .tab {
    padding: 14px 20px;
    cursor: pointer;
    border: none;
    outline: none;
    background-color: var(--tab-bg);
    color: var(--text-color);
    transition: 0.3s;
    font-size: 16px;
  }

  .tab:hover {
    background-color: var(--tab-hover);
  }

  .tab.active {
    background-color: var(--accent);
    color: #fff;
    border-radius: 4px 4px 0 0;
  }

  .gallery {
    display: none;
    padding: 20px;
    text-align: center;
    animation: fadeIn 0.4s ease-in;
  }

  .gallery.active {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 15px;
  }

  .gallery img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 8px;
    cursor: pointer;
    transition: transform 0.3s ease;
  }

  .gallery img:hover {
    transform: scale(1.05);
  }

  /* Lightbox */
  .lightbox {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: var(--overlay-bg);
    justify-content: center;
    align-items: center;
    z-index: 999;
    flex-direction: column;
  }

  .lightbox.active {
    display: flex;
  }

  .lightbox img {
    max-width: 90%;
    max-height: 80%;
    border-radius: 8px;
    box-shadow: 0 0 10px #000;
  }

  .close-btn, .prev-btn, .next-btn, .lightbox-slideshow-btn {
    position: absolute;
    font-size: 28px;
    color: var(--text-color);
    background: rgba(0,0,0,0.4);
    border: none;
    border-radius: 50%;
    padding: 10px;
    cursor: pointer;
    transition: 0.3s;
  }

  .close-btn {
    top: 5%;
    right: 5%;
    transform: none;
    font-size: 26px;
  }

  .prev-btn { left: 5%; top: 50%; transform: translateY(-50%); }
  .next-btn { right: 5%; top: 50%; transform: translateY(-50%); }

  .lightbox-slideshow-btn {
    bottom: 10%;
    background: var(--accent);
    border-radius: 8px;
    font-size: 16px;
    padding: 8px 16px;
  }

  .close-btn:hover, .prev-btn:hover, .next-btn:hover, .lightbox-slideshow-btn:hover {
    background: var(--accent);
  }

  @keyframes fadeIn {
    from {opacity: 0;}
    to {opacity: 1;}
  }

    .btn {
    background: #222;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 10px 16px;
    cursor: pointer;
    font-size: 16px;
    transition: all 0.2s ease;
  }

  .btn:hover {
    background: #007bff;
    transform: translateY(-2px);
  }

  .btn:active {
    transform: translateY(0);
  }

  a {
    color: #fff;
    textonderline: none;
  }
</style>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
  <button class="close-btn" onclick="closeLightbox()">✖</button>
  <button class="prev-btn" onclick="changeImage(-1)">❮</button>
  <img id="lightbox-img" src="" alt="Lightbox">
  <button class="next-btn" onclick="changeImage(1)">❯</button>
  <button class="lightbox-slideshow-btn" onclick="toggleLightboxSlideshow()">▶️ Start Slideshow</button>
</div>

<script>
let tabSlideshowInterval = null;
let tabSlideshowRunning = false;
let lightboxSlideshowInterval = null;
let lightboxSlideshowRunning = false;
let currentGallery = 'nature';
let currentIndex = 0;

// Tabs
function openGallery(evt, galleryName) {
  const galleries = document.querySelectorAll(".gallery");
  const tabs = document.querySelectorAll(".tab");

  galleries.forEach(g => g.classList.remove("active"));
  tabs.forEach(t => t.classList.remove("active"));

  document.getElementById(galleryName).classList.add("active");
  evt.currentTarget.classList.add("active");
  currentGallery = galleryName;
}

// Theme toggle
function toggleTheme() {
  document.body.classList.toggle("light");
}

// Slideshow tussen tabs
function toggleSlideshow() {
  const btn = document.querySelector(".slideshow-btn");
  const tabs = document.querySelectorAll(".tab");
  const tabArray = Array.from(tabs);

  if (!tabSlideshowRunning) {
    let index = tabArray.findIndex(t => t.classList.contains("active"));
    tabSlideshowRunning = true;
    btn.textContent = "⏸️ Stop Tab Slideshow";

    tabSlideshowInterval = setInterval(() => {
      index = (index + 1) % tabArray.length;
      tabArray[index].click();
    }, 3000);
  } else {
    tabSlideshowRunning = false;
    btn.textContent = "▶️ Start Tab Slideshow";
    clearInterval(tabSlideshowInterval);
  }
}

// Lightbox
function openLightbox(src, index) {
  const lightbox = document.getElementById("lightbox");
  const img = document.getElementById("lightbox-img");
  img.src = src;
  lightbox.classList.add("active");
  currentIndex = index;
}

function closeLightbox() {
  document.getElementById("lightbox").classList.remove("active");
  stopLightboxSlideshow();
}

function changeImage(direction) {
  const gallery = document.getElementById(currentGallery);
  const images = gallery.querySelectorAll("img");
  currentIndex = (currentIndex + direction + images.length) % images.length;
  document.getElementById("lightbox-img").src = images[currentIndex].src;
}

// Lightbox slideshow
function toggleLightboxSlideshow() {
  const btn = document.querySelector(".lightbox-slideshow-btn");

  if (!lightboxSlideshowRunning) {
    lightboxSlideshowRunning = true;
    btn.textContent = "⏸️ Stop Slideshow";
    lightboxSlideshowInterval = setInterval(() => changeImage(1), 2500);
  } else {
    stopLightboxSlideshow();
  }
}

function stopLightboxSlideshow() {
  lightboxSlideshowRunning = false;
  clearInterval(lightboxSlideshowInterval);
  document.querySelector(".lightbox-slideshow-btn").textContent = "▶️ Start Slideshow";
}

// Klik op afbeelding → open lightbox
document.querySelectorAll(".gallery img").forEach((img) => {
  img.addEventListener("click", () => {
    const gallery = img.closest(".gallery");
    currentGallery = gallery.id;
    const galleryImages = Array.from(gallery.querySelectorAll("img"));
    openLightbox(img.src, galleryImages.indexOf(img));
  });
});

// Toetsenbordbediening
document.addEventListener("keydown", (e) => {
  const lightbox = document.getElementById("lightbox");
  if (!lightbox.classList.contains("active")) return;
  if (e.key === "Escape") closeLightbox();
  if (e.key === "ArrowRight") changeImage(1);
  if (e.key === "ArrowLeft") changeImage(-1);
});
</script>

</body>
