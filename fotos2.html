<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tab Image Gallery Ultra+ (Fade Deluxe)</title>
<style>
  :root {
    --bg-color: #111;
    --text-color: #fff;
    --tab-bg: #222;
    --tab-hover: #333;
    --accent: #0078ff;
    --overlay-bg: rgba(0, 0, 0, 0.9);
  }

  body.light {
    --bg-color: #f5f5f5;
    --text-color: #111;
    --tab-bg: #ddd;
    --tab-hover: #ccc;
    --accent: #0078ff;
    --overlay-bg: rgba(255, 255, 255, 0.9);
  }

  body {
    font-family: Arial, sans-serif;
    background-color: var(--bg-color);
    color: var(--text-color);
    margin: 0;
    padding: 0;
    transition: background 0.4s, color 0.4s;
  }

  h1 {
    text-align: center;
    margin-top: 20px;
  }

  .controls {
    text-align: center;
    margin: 10px 0;
  }

  .toggle-btn, .slideshow-btn {
    background-color: var(--tab-bg);
    color: var(--text-color);
    border: none;
    padding: 10px 16px;
    border-radius: 6px;
    margin: 0 6px;
    cursor: pointer;
    font-size: 14px;
    transition: 0.3s;
  }

  .toggle-btn:hover, .slideshow-btn:hover {
    background-color: var(--tab-hover);
  }

  .tab-container {
    display: flex;
    justify-content: center;
    background-color: var(--tab-bg);
    flex-wrap: wrap;
  }

  .tab {
    padding: 14px 20px;
    cursor: pointer;
    border: none;
    outline: none;
    background-color: var(--tab-bg);
    color: var(--text-color);
    transition: 0.3s;
    font-size: 16px;
  }

  .tab:hover {
    background-color: var(--tab-hover);
  }

  .tab.active {
    background-color: var(--accent);
    color: #fff;
    border-radius: 4px 4px 0 0;
  }

  .gallery {
    opacity: 0;
    visibility: hidden;
    padding: 20px;
    text-align: center;
    transition: opacity 0.6s ease-in-out, visibility 0.6s;
    position: absolute;
    width: 100%;
    left: 0;
    top: 160px;
  }

  .gallery.active {
    opacity: 1;
    visibility: visible;
    position: relative;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 15px;
  }

  .gallery img {
    width: 100%;
    height: 180px;
    object-fit: cover;
    border-radius: 8px;
    cursor: pointer;
    transition: transform 0.3s ease;
  }

  .gallery img:hover {
    transform: scale(1.05);
  }

  /* Lightbox */
  .lightbox {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: var(--overlay-bg);
    justify-content: center;
    align-items: center;
    z-index: 999;
    flex-direction: column;
  }

  .lightbox.active {
    display: flex;
  }

  .lightbox img {
    max-width: 90%;
    max-height: 70%;
    border-radius: 8px;
    box-shadow: 0 0 10px #000;
    opacity: 0;
    transition: opacity 0.6s ease-in-out;
  }

  .lightbox img.visible {
    opacity: 1;
  }

  .close-btn, .prev-btn, .next-btn, .lightbox-slideshow-btn {
    position: absolute;
    font-size: 28px;
    color: var(--text-color);
    background: rgba(0,0,0,0.4);
    border: none;
    border-radius: 50%;
    padding: 10px;
    cursor: pointer;
    transition: 0.3s;
  }

  .close-btn {
    top: 5%;
    right: 5%;
    transform: none;
    font-size: 26px;
  }

  .prev-btn { left: 5%; top: 50%; transform: translateY(-50%); }
  .next-btn { right: 5%; top: 50%; transform: translateY(-50%); }

  .lightbox-slideshow-btn {
    bottom: 18%;
    background: var(--accent);
    border-radius: 8px;
    font-size: 16px;
    padding: 8px 16px;
  }

  .close-btn:hover, .prev-btn:hover, .next-btn:hover, .lightbox-slideshow-btn:hover {
    background: var(--accent);
  }

  /* Thumbnail strip */
  .thumbnail-strip {
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: nowrap;
    overflow-x: auto;
    padding: 10px;
    max-width: 90%;
  }

  .thumbnail-strip img {
    width: 70px;
    height: 50px;
    object-fit: cover;
    border-radius: 5px;
    cursor: pointer;
    opacity: 0.6;
    transition: 0.3s;
  }

  .thumbnail-strip img.active,
  .thumbnail-strip img:hover {
    opacity: 1;
    border: 2px solid var(--accent);
  }
</style>
</head>
  
<body>
    <nav>
  <button class="btn"><a href="https://opadam.github.io/bruiloft50jaar/">Home</a></button>
  <br><br>
</nav>

<h1>🖼️ Tab Image Gallery Ultra+ (Fade Deluxe)</h1>

<div class="controls">
  <button class="toggle-btn" onclick="toggleTheme()">🌙 Dark / ☀️ Light</button>
  <button class="slideshow-btn" onclick="toggleTabSlideshow()">▶️ Start Tab Slideshow</button>
</div>

<div class="tab-container">
  <button class="tab active" onclick="openGallery(event, 'nature')">Nature</button>
  <button class="tab" onclick="openGallery(event, 'cities')">Cities</button>
  <button class="tab" onclick="openGallery(event, 'animals')">Animals</button>
</div>

<!-- Galleries -->
<div id="nature" class="gallery active">
  <img src="https://picsum.photos/id/1018/800/500" alt="Nature 1">
  <img src="https://picsum.photos/id/1015/800/500" alt="Nature 2">
  <img src="https://picsum.photos/id/1016/800/500" alt="Nature 3">
  <img src="https://picsum.photos/id/1020/800/500" alt="Nature 4">
</div>

<div id="cities" class="gallery">
  <img src="https://picsum.photos/id/1031/800/500" alt="City 1">
  <img src="https://picsum.photos/id/1035/800/500" alt="City 2">
  <img src="https://picsum.photos/id/1043/800/500" alt="City 3">
  <img src="https://picsum.photos/id/1050/800/500" alt="City 4">
</div>

<div id="animals" class="gallery">
  <img src="https://picsum.photos/id/237/800/500" alt="Animal 1">
  <img src="https://picsum.photos/id/433/800/500" alt="Animal 2">
  <img src="https://picsum.photos/id/593/800/500" alt="Animal 3">
  <img src="https://picsum.photos/id/659/800/500" alt="Animal 4">
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
  <button class="close-btn" onclick="closeLightbox()">✖</button>
  <button class="prev-btn" onclick="changeImage(-1)">❮</button>
  <img id="lightbox-img" src="" alt="Lightbox">
  <button class="next-btn" onclick="changeImage(1)">❯</button>
  <button class="lightbox-slideshow-btn" onclick="toggleLightboxSlideshow()">▶️ Start Slideshow</button>
  <div class="thumbnail-strip" id="thumbnail-strip"></div>
</div>

<script>
let tabSlideInterval, tabSlideRunning = false;
let lightboxSlideInterval, lightboxSlideRunning = false;
let currentGallery = 'nature', currentIndex = 0;

// Tabs
function openGallery(evt, galleryName) {
  document.querySelectorAll(".gallery").forEach(g => g.classList.remove("active"));
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  document.getElementById(galleryName).classList.add("active");
  evt.currentTarget.classList.add("active");
  currentGallery = galleryName;
}

// Thema toggle
function toggleTheme() {
  document.body.classList.toggle("light");
}

// Tab slideshow
function toggleTabSlideshow() {
  const btn = document.querySelector(".slideshow-btn");
  const tabs = [...document.querySelectorAll(".tab")];
  if (!tabSlideRunning) {
    let index = tabs.findIndex(t => t.classList.contains("active"));
    tabSlideRunning = true;
    btn.textContent = "⏸️ Stop Tab Slideshow";
    tabSlideInterval = setInterval(() => {
      index = (index + 1) % tabs.length;
      tabs[index].click();
    }, 3000);
  } else {
    clearInterval(tabSlideInterval);
    btn.textContent = "▶️ Start Tab Slideshow";
    tabSlideRunning = false;
  }
}

// Lightbox
function openLightbox(src, index) {
  const lightbox = document.getElementById("lightbox");
  const img = document.getElementById("lightbox-img");
  img.classList.remove("visible");
  img.src = src;
  setTimeout(() => img.classList.add("visible"), 100);
  lightbox.classList.add("active");
  currentIndex = index;
  buildThumbnails();
}

function closeLightbox() {
  document.getElementById("lightbox").classList.remove("active");
  stopLightboxSlideshow();
}

function changeImage(direction) {
  const gallery = document.getElementById(currentGallery);
  const images = gallery.querySelectorAll("img");
  currentIndex = (currentIndex + direction + images.length) % images.length;

  const img = document.getElementById("lightbox-img");
  img.classList.remove("visible");
  setTimeout(() => {
    img.src = images[currentIndex].src;
    img.classList.add("visible");
  }, 200);

  updateThumbnailHighlight();
}

// Lightbox slideshow
function toggleLightboxSlideshow() {
  const btn = document.querySelector(".lightbox-slideshow-btn");
  if (!lightboxSlideRunning) {
    lightboxSlideRunning = true;
    btn.textContent = "⏸️ Stop Slideshow";
    lightboxSlideInterval = setInterval(() => changeImage(1), 2500);
  } else {
    stopLightboxSlideshow();
  }
}

function stopLightboxSlideshow() {
  lightboxSlideRunning = false;
  clearInterval(lightboxSlideInterval);
  document.querySelector(".lightbox-slideshow-btn").textContent = "▶️ Start Slideshow";
}

// Miniaturen
function buildThumbnails() {
  const gallery = document.getElementById(currentGallery);
  const images = gallery.querySelectorAll("img");
  const strip = document.getElementById("thumbnail-strip");
  strip.innerHTML = "";

  images.forEach((img, i) => {
    const thumb = document.createElement("img");
    thumb.src = img.src;
    thumb.classList.toggle("active", i === currentIndex);
    thumb.addEventListener("click", () => {
      currentIndex = i;
      changeImage(0);
    });
    strip.appendChild(thumb);
  });
}

function updateThumbnailHighlight() {
  document.querySelectorAll("#thumbnail-strip img").forEach((thumb, i) => {
    thumb.classList.toggle("active", i === currentIndex);
  });
}

// Klik op afbeelding → open lightbox
document.querySelectorAll(".gallery img").forEach(img => {
  img.addEventListener("click", () => {
    const gallery = img.closest(".gallery");
    currentGallery = gallery.id;
    const galleryImages = [...gallery.querySelectorAll("img")];
    openLightbox(img.src, galleryImages.indexOf(img));
  });
});

// Keyboard bediening
document.addEventListener("keydown", e => {
  const lightbox = document.getElementById("lightbox");
  if (!lightbox.classList.contains("active")) return;
  if (e.key === "Escape") closeLightbox();
  if (e.key === "ArrowRight") changeImage(1);
  if (e.key === "ArrowLeft") changeImage(-1);
});
</script>

</body>
</html>
